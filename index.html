<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Лови Ритм — проверь чувство ритма</title>
  <meta name="description" content="20 секунд: тапай или говори «та» в такт клику, а когда звук выключится — держи темп сам. Честная шкала до 1000 баллов.">
  <meta name="theme-color" content="#0b0f18">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="icon" href="/static/img/favicon.svg?v=2" type="image/svg+xml">
  <link rel="icon" href="/static/img/favicon-32.png?v=2" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="/static/img/apple-touch-icon.png?v=2">
  <link rel="manifest" href="/manifest.json">
  <link rel="stylesheet" href="/static/css/app.css?v=39">
  
</head>
<body data-page="test">
  <div class="page">
    <header class="topbar">
      <a class="brand" href="/" aria-label="Лови Ритм">
        <svg class="brand__icon" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
          <rect width="64" height="64" rx="14" fill="#7c3aed"/>
          <path d="M27.4 23.2c.25-1.5 1.2-2.2 2.7-2.2h7.8c1.5 0 2.45.7 2.7 2.2L48.2 46.4c.4 2-.75 3.2-2.7 3.2H18.5c-1.95 0-3.1-1.2-2.7-3.2z" fill="#ffffff"/>
          <path d="M31.6 44.6 36.4 30" stroke="#7c3aed" stroke-width="4.6" stroke-linecap="round"/>
          <path d="M37 27.5 41.6 14.5" stroke="#ffffff" stroke-width="4.6" stroke-linecap="round"/>
          <circle cx="42.6" cy="11.8" r="4.2" fill="#ffffff"/>
        </svg>Лови Ритм
      </a>
      <nav class="topnav" aria-label="Разделы">
        <a class="nav-link is-active" href="/" aria-current="page">Тест</a>
        <a class="nav-link" href="/records.html">Рекорды</a>
      </nav>
    </header>

    <main id="main"><div class="wrap">

  <!-- ======================= СТАРТ ======================= -->
  <section id="screenStart" class="screen">
    <h1 class="hero">Проверьте своё чувство ритма</h1>

    <p class="step">Выберите режим</p>
    <div class="modes" role="group" aria-label="Способ ввода">
      <button type="button" id="modeTap" class="mode" aria-pressed="false">
        <img class="mode__img" src="/static/img/mode-tap.jpg" alt="" width="900" height="675"
             loading="eager" decoding="async">
        <span class="mode__scrim" aria-hidden="true"></span>
        <span class="mode__body">
          <span class="mode__name">Тапами</span>
          <span class="mode__desc">По экрану или клавишей «Пробел»</span>
        </span>
      </button>
      <button type="button" id="modeVoice" class="mode" aria-pressed="false">
        <img class="mode__img" src="/static/img/mode-voice.jpg" alt="" width="900" height="675"
             loading="eager" decoding="async">
        <span class="mode__scrim" aria-hidden="true"></span>
        <span class="mode__body">
          <span class="mode__name">Голосом</span>
          <span class="mode__desc">Резко говорите «та» в микрофон</span>
        </span>
      </button>
    </div>

    <button type="button" id="btnStart" class="btn btn--big">Начать тест</button>
    <p id="micStatus" class="notice" hidden></p>
  </section>

  <!-- ====================== РЕЗУЛЬТАТ ===================== -->
  <section id="screenResults" class="screen" hidden>
    <p class="pill">Тест пройден</p>

    <div class="score">
      <span id="finalScore" class="score__num">0</span>
      <span class="score__max">из 1000</span>
    </div>
    <h2 id="finalRank" class="rank"></h2>
    <p id="finalNote" class="lead lead--small"></p>

    <div class="stats">
      <div class="stat"><b id="statAbs">—</b><span>средняя ошибка</span></div>
      <div class="stat"><b id="statSpread">—</b><span>разброс</span></div>
      <div class="stat"><b id="statBias">—</b><span>спешите / тянете</span></div>
      <div class="stat"><b id="statTaps">—</b><span>зачётных ударов</span></div>
    </div>

    <form id="saveForm" class="save">
      <input id="nameInput" type="text" maxlength="20" placeholder="Ваше имя"
             autocomplete="off" aria-label="Ваше имя">
      <button id="btnSave" class="btn btn--big" type="submit">Сохранить в рекорды</button>
    </form>
    <p id="saveMsg" class="notice"></p>

    <div class="actions">
      <button type="button" id="btnAgain" class="btn btn--ghost">Пройти ещё раз</button>
      <a class="btn btn--ghost" href="/records.html">Таблица рекордов</a>
    </div>

    <details class="details">
      <summary>Подробно по ударам</summary>
      <div id="beatCells" class="cells"></div>
      <div id="chart" class="chart"></div>
    </details>
  </section>
</div>

<!-- ============ ТЕСТ: тап работает по всему экрану ============ -->
<section id="screenTest" class="stage-wrap" hidden>
  <div id="stage" class="stage" role="button" tabindex="0" aria-label="Тапайте в ритм">
    <p id="stageKicker" class="stage__kicker"></p>
    <p id="stageMain" class="stage__main"></p>
    <p id="stageSub" class="stage__sub"></p>
  </div>
  <button type="button" id="btnStop" class="stage__stop">Завершить</button>
</section>
</main>
  </div>

  <footer class="foot">
    <section class="author-card" aria-labelledby="authorTitle" data-reveal>
      <p class="author-card__kicker" id="authorTitle">Автор проекта</p>
      <p class="author-card__name">Денис Склизков</p>
      <p class="author-card__links">
        <a href="https://github.com/denklin18-star" target="_blank" rel="noopener noreferrer">GitHub</a>
        <span class="author-card__sep" aria-hidden="true">·</span>
        <a href="https://vk.ru/folkdens" target="_blank" rel="noopener noreferrer">ВКонтакте</a>
      </p>
      <a class="author-card__cta"
         href="https://forms.yandex.ru/u/6af823d995add5f825b79e10/"
         target="_blank"
         rel="noopener noreferrer">
        Идеи и баги
      </a>
      <p class="author-card__copyright">© 2026 «Лови Ритм». Все права защищены.</p>
    </section>
  </footer>

  <script src="/static/js/online.js?v=1" defer></script>
  <script src="/static/js/site.js?v=9" defer></script>
  <script src="/static/js/feedback.js?v=5" defer></script>
  <script src="/static/js/voice-gate.js?v=4" defer></script><script src="/static/js/mic.js?v=4" defer></script><script src="/static/js/test.js?v=32" defer></script>
</body>
</html>
