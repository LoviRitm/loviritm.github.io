<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Админка — Лови Ритм</title>
  <link rel="icon" href="/favicon.ico" type="image/x-icon">
  <link rel="stylesheet" href="/static/admin/admin.css?v=5">
</head>
<body>
  <div id="loginView" class="auth">
    <form id="loginForm" class="auth__card">
      <p class="kicker">Лови Ритм</p>
      <h1>Админка</h1>
      <p class="auth__lead">Вход для владельца сайта.</p>

      <label class="field">
        <span>Email</span>
        <input id="email" type="email" autocomplete="username" required>
      </label>

      <label class="field">
        <span>Пароль</span>
        <input id="password" type="password" autocomplete="current-password" required>
      </label>

      <button class="btn" type="submit">Войти</button>
      <p id="loginMsg" class="msg" role="status"></p>
      <a class="auth__back" href="/">← Вернуться на сайт</a>
    </form>
  </div>

  <div id="appView" class="app" hidden>
    <header class="topbar">
      <a class="brand" href="/">Лови Ритм</a>
      <div class="topbar__right">
        <span id="adminEmail" class="muted"></span>
        <button id="logoutBtn" class="btn btn--ghost" type="button">Выйти</button>
      </div>
    </header>

    <main class="shell">
      <div class="page-head">
        <div>
          <p class="kicker">Админка</p>
          <h1>Статистика и результаты</h1>
        </div>
        <div class="page-head__controls">
          <label class="field field--inline">
            <span>Период</span>
            <select id="rangeSelect">
              <option value="7">7 дней</option>
              <option value="30" selected>30 дней</option>
              <option value="90">90 дней</option>
              <option value="365">Год</option>
            </select>
          </label>
          <button id="refreshBtn" class="btn" type="button">Обновить</button>
        </div>
      </div>

      <p id="appMsg" class="msg" role="status"></p>

      <section class="panel panel--today" aria-labelledby="todayTitle">
        <div class="panel__head">
          <h2 id="todayTitle">Сегодня</h2>
          <span id="todayNote" class="muted"></span>
        </div>
        <div id="todayCards" class="cards cards--today"></div>
      </section>

      <section id="cards" class="cards" aria-label="Сводка за период"></section>

      <section class="panel">
        <div class="panel__head">
          <h2>Посещения</h2>
          <span id="dailyChartNote" class="muted">По дням</span>
        </div>
        <div id="dailyChart" class="chart"></div>
      </section>

      <div class="grid2">
        <section class="panel">
          <div class="panel__head">
            <h2>Режимы теста</h2>
          </div>
          <div id="modeChart" class="mode-list"></div>
        </section>

        <section class="panel">
          <div class="panel__head">
            <h2>Топ результатов</h2>
          </div>
          <div id="topScores" class="top-list"></div>
        </section>
      </div>

      <section class="panel">
        <div class="panel__head panel__head--wrap">
          <div>
            <h2>Данные</h2>
            <p id="tableInfo" class="muted"></p>
          </div>
          <div class="tabs" role="tablist" aria-label="Тип данных">
            <button class="tab is-active" type="button" data-tab="attempts" role="tab" aria-selected="true">Все тесты</button>
            <button class="tab" type="button" data-tab="scores" role="tab" aria-selected="false">Сохранённые рекорды</button>
            <button class="tab" type="button" data-tab="visits" role="tab" aria-selected="false">Посещения</button>
          </div>
        </div>

        <div class="filters">
          <label class="field field--inline">
            <span>Поиск</span>
            <input id="searchInput" type="search" placeholder="Имя, страница, игрок…" autocomplete="off">
          </label>
          <label class="field field--inline">
            <span>Режим</span>
            <select id="modeFilter">
              <option value="">Все</option>
              <option value="tap">Тапами</option>
              <option value="voice">Голосом</option>
            </select>
          </label>
          <label class="field field--inline">
            <span>Сортировка</span>
            <select id="sortSelect">
              <option value="date-desc">Дата: сначала новые</option>
              <option value="date-asc">Дата: сначала старые</option>
              <option value="score-desc" data-score>Рейтинг: по убыванию</option>
              <option value="score-asc" data-score>Рейтинг: по возрастанию</option>
            </select>
          </label>
          <button id="exportBtn" class="btn btn--ghost" type="button">Экспорт CSV</button>
        </div>

        <div class="table-wrap">
          <table id="dataTable">
            <thead id="tableHead"></thead>
            <tbody id="tableBody"></tbody>
          </table>
        </div>
        <p id="emptyMsg" class="empty" hidden>Данных за выбранный период нет.</p>
      </section>
    </main>
  </div>

  <dialog id="detailDialog" class="dialog">
    <div class="dialog__head">
      <h2 id="detailTitle">Результат</h2>
      <button id="detailClose" class="btn btn--ghost" type="button">Закрыть</button>
    </div>
    <div id="detailBody" class="dialog__body"></div>
  </dialog>

  <script src="/static/admin/admin.js?v=8" defer></script>
</body>
</html>
