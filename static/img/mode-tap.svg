<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Режим тапами: палец касается экрана">
  <defs>
    <linearGradient id="tapBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a2130"/>
      <stop offset="1" stop-color="#0d1219"/>
    </linearGradient>
    <radialGradient id="tapGlow" cx="50%" cy="28%" r="46%">
      <stop offset="0" stop-color="#8b5cf6" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#8b5cf6" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="fingerFill" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#d7dded"/>
    </linearGradient>
  </defs>

  <rect width="800" height="600" fill="url(#tapBg)"/>
  <rect width="800" height="600" fill="url(#tapGlow)"/>

  <!-- телефон -->
  <rect x="300" y="-40" width="200" height="360" rx="38" fill="#1b2231" stroke="#303a4e" stroke-width="3"/>
  <rect x="315" y="-20" width="170" height="322" rx="26" fill="#111722"/>
  <rect x="365" y="4" width="70" height="9" rx="4.5" fill="#252f41"/>

  <!-- круги от касания -->
  <g fill="none">
    <circle cx="400" cy="150" r="26" stroke="#8b5cf6" stroke-width="6" opacity="0.95"/>
    <circle cx="400" cy="150" r="58" stroke="#8b5cf6" stroke-width="4" opacity="0.55"/>
    <circle cx="400" cy="150" r="94" stroke="#22d3ee" stroke-width="3" opacity="0.32"/>
  </g>

  <!-- палец: сужается к подушечке, кисть уходит за правый край -->
  <path d="M820 132 C 700 141 590 152 505 162 C 466 166 448 172 442 178
           C 434 186 440 196 456 199 C 500 206 600 214 700 222 L 820 232 Z"
        fill="url(#fingerFill)" opacity="0.97"/>
  <ellipse cx="447" cy="163" rx="13" ry="8" transform="rotate(-10 447 163)" fill="#c3cce2" opacity="0.7"/>
  <path d="M600 148 C 660 145 700 144 760 145" fill="none" stroke="#c3cce2" stroke-width="3" opacity="0.35"/>
</svg>
